<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 5v5 FPS Melee Arena MOBA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* Tâm ngắm (Crosshair) */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 16px; height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%; pointer-events: none; z-index: 10;
        }
        #crosshair::after {
            content: ''; position: absolute; top: 5px; left: 5px;
            width: 2px; height: 2px; background: #ff0055; border-radius: 50%;
        }

        /* Bảng điểm HUD trên */
        .hud-top {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 30px; align-items: center; z-index: 10;
            background: rgba(15, 23, 42, 0.85); padding: 12px 30px;
            border-radius: 16px; border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); color: #fff;
        }
        .score-box { font-size: 20px; font-weight: 800; text-transform: uppercase; }
        .score-blue { color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        .score-red { color: #f43f5e; text-shadow: 0 0 10px rgba(244, 63, 94, 0.5); }
        .timer { font-size: 28px; font-weight: 900; color: #facc15; font-mono: monospace; }

        /* HUD Thanh máu góc dưới */
        .hud-bottom {
            position: absolute; bottom: 25px; left: 25px; z-index: 10;
            background: rgba(15, 23, 42, 0.85); padding: 16px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15); width: 280px; color: #fff;
        }
        .hp-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; margin-bottom: 6px; }
        .hp-bar-bg { width: 100%; height: 16px; background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #475569; }
        .hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #10b981, #34d399); transition: width 0.15s ease-out; }

        /* Khai báo Kỹ năng */
        .skills-container { position: absolute; bottom: 25px; right: 25px; z-index: 10; display: flex; gap: 12px; }
        .skill-btn {
            width: 72px; height: 72px; background: rgba(15, 23, 42, 0.85);
            border: 2px solid #475569; border-radius: 14px; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            color: #fff; font-weight: bold; cursor: pointer; position: relative;
        }
        .skill-btn small { font-size: 10px; color: #94a3b8; margin-top: 2px; }
        .cooldown-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); border-radius: 12px; display: none;
            align-items: center; justify-content: center; font-size: 22px; color: #facc15; font-weight: 900;
        }

        /* Thông báo Target Lock */
        #target-banner {
            position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
            color: #fbbf24; font-weight: bold; font-size: 14px; background: rgba(0,0,0,0.7);
            padding: 6px 18px; border-radius: 20px; display: none; z-index: 10;
            border: 1px solid rgba(251, 191, 36, 0.4); text-transform: uppercase; letter-spacing: 1px;
        }
    </style>
    <!-- Thư viện Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="target-banner">🎯 ĐÃ KHÓA TIÊU ĐIỂM - TỰ QUAY LẠI ĐÁNH</div>

    <div class="hud-top">
        <div class="score-box score-blue">XANH: <span id="blue-kills">0</span>/30</div>
        <div class="timer" id="timer">05:00</div>
        <div class="score-box score-red">ĐỎ: <span id="red-kills">0</span>/30</div>
    </div>

    <div class="hud-bottom">
        <div class="hp-header">
            <span>TƯỚNG CỦA BẠN</span>
            <span id="hp-text">100 / 100</span>
        </div>
        <div class="hp-bar-bg"><div id="player-hp" class="hp-bar-fill"></div></div>
    </div>

    <div class="skills-container">
        <div class="skill-btn" style="border-color:#38bdf8;">
            <span>ĐÁNH</span>
            <small>CLICK CHUỘT</small>
        </div>
        <div class="skill-btn" id="btn-heal" style="border-color:#10b981;">
            <span>HỒI MÁU</span>
            <small>PHÍM [E]</small>
            <div class="cooldown-overlay" id="cd-heal">10</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- GAME LOGIC CODE ---
        const CONFIG = {
            MAX_HP: 100,
            DAMAGE: 20,
            HEAL_AMOUNT: 50,
            HEAL_CD: 10,
            WIN_KILLS: 30,
            MATCH_TIME: 300
        };

        let scene, camera, renderer, raycaster, mouse;
        let player, playerFist;
        let targetsList = [];
        let kills = { blue: 0, red: 0 };
        let matchTime = CONFIG.MATCH_TIME;
        let lockedTarget = null;
        let healCooldown = 0;
        let isAttacking = false;

        function initGame() {
            const container = document.getElementById('canvas-container');

            // 1. Scene & Camera 3D Góc Nhìn Thứ Nhất
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.012);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // 2. Ánh sáng
            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(40, 60, 20);
            sun.castShadow = true;
            scene.add(sun);

            // 3. Bản đồ & Trụ & Lính
            buildMap();
            spawnTowers();
            spawnHeroes();

            // 4. Tạo Nhân vật Người chơi (Đội Xanh)
            player = {
                mesh: new THREE.Group(),
                hp: CONFIG.MAX_HP,
                team: 'blue',
                speed: 0.18,
                range: 3.0
            };
            player.mesh.position.set(0, 1.5, 30);
            scene.add(player.mesh);

            // Nắm đấm FPS Góc nhìn thứ nhất
            const fistGeo = new THREE.BoxGeometry(0.25, 0.25, 0.6);
            const fistMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
            playerFist = new THREE.Mesh(fistGeo, fistMat);
            playerFist.position.set(0.35, -0.3, -0.5);
            camera.add(playerFist);
            player.mesh.add(camera);

            // 5. Sự kiện Điều khiển
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('keydown', (e) => {
                if (e.key.toLowerCase() === 'e') triggerHeal();
            });

            // Đồng hồ đếm ngược
            setInterval(updateTimer, 1000);

            // Render loop
            animate();
        }

        function buildMap() {
            // Mặt đất Arena
            const groundGeo = new THREE.PlaneGeometry(120, 120);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Đường Làn (Lane chính)
            const laneGeo = new THREE.PlaneGeometry(20, 120);
            const laneMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
            const lane = new THREE.Mesh(laneGeo, laneMat);
            lane.rotation.x = -Math.PI / 2;
            lane.position.y = 0.02;
            scene.add(lane);
        }

        function spawnTowers() {
            createTower(0, -20, 'red');   // Trụ Đỏ
            createTower(0, 20, 'blue');   // Trụ Xanh
        }

        function createTower(x, z, team) {
            const group = new THREE.Group();
            const geo = new THREE.CylinderGeometry(1.5, 2, 8, 16);
            const mat = new THREE.MeshStandardMaterial({ color: team === 'blue' ? 0x0284c7 : 0xe11d48 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = 4;
            mesh.castShadow = true;
            group.add(mesh);
            group.position.set(x, 0, z);

            group.userData = { id: Math.random(), hp: 300, maxHp: 300, team: team, type: 'tower' };
            scene.add(group);
            targetsList.push(group);
        }

        function spawnHeroes() {
            // 4 Đồng đội Xanh
            for (let i = 0; i < 4; i++) createEntity('blue', -12 + i * 8, 25);
            // 5 Địch Đỏ
            for (let i = 0; i < 5; i++) createEntity('red', -16 + i * 8, -25);
        }

        function createEntity(team, x, z) {
            const group = new THREE.Group();
            const geo = new THREE.CylinderGeometry(0.6, 0.6, 2, 16);
            const mat = new THREE.MeshStandardMaterial({ color: team === 'blue' ? 0x38bdf8 : 0xf43f5e });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = 1;
            mesh.castShadow = true;
            group.add(mesh);
            group.position.set(x, 0, z);

            group.userData = { id: Math.random(), hp: 100, maxHp: 100, team: team, type: 'hero' };
            scene.add(group);
            targetsList.push(group);
        }

        // Tự động xoay & Tấn công khi nhấp chuột chọn mục tiêu
        function onPointerDown(event) {
            // Bỏ qua nếu click vào UI
            if (event.clientY > window.innerHeight - 100 && event.clientX > window.innerWidth - 200) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            for (let hit of intersects) {
                let current = hit.object;
                while (current.parent && current.parent !== scene) {
                    current = current.parent;
                }
                
                if (current.userData && current.userData.team && current.userData.team !== player.team) {
                    lockedTarget = current;
                    document.getElementById('target-banner').style.display = 'block';
                    return;
                }
            }
        }

        function triggerHeal() {
            if (healCooldown > 0) return;

            player.hp = Math.min(CONFIG.MAX_HP, player.hp + CONFIG.HEAL_AMOUNT);
            updateHUD();

            healCooldown = CONFIG.HEAL_CD;
            const cdOverlay = document.getElementById('cd-heal');
            cdOverlay.style.display = 'flex';
            cdOverlay.innerText = healCooldown;

            const interval = setInterval(() => {
                healCooldown--;
                cdOverlay.innerText = healCooldown;
                if (healCooldown <= 0) {
                    clearInterval(interval);
                    cdOverlay.style.display = 'none';
                }
            }, 1000);
        }

        function updateHUD() {
            const percentage = (player.hp / CONFIG.MAX_HP) * 100;
            document.getElementById('player-hp').style.width = percentage + '%';
            document.getElementById('hp-text').innerText = `${player.hp} / ${CONFIG.MAX_HP}`;
        }

        function updateTimer() {
            if (matchTime <= 0) return;
            matchTime--;
            const m = String(Math.floor(matchTime / 60)).padStart(2, '0');
            const s = String(matchTime % 60).padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }

        function animate() {
            requestAnimationFrame(animate);

            // Xử lý di chuyển & Đánh tự động khi ĐÃ KHÓA MỤC TIÊU
            if (lockedTarget && lockedTarget.userData.hp > 0) {
                const playerPos = player.mesh.position;
                const targetPos = lockedTarget.position;
                const distance = playerPos.distanceTo(targetPos);

                // 1. Tự quay mặt về phía mục tiêu
                player.mesh.lookAt(targetPos.x, playerPos.y, targetPos.z);

                // 2. Tiến lại gần hoặc tung đòn đánh
                if (distance > player.range) {
                    const dir = new THREE.Vector3().subVectors(targetPos, playerPos).normalize();
                    playerPos.addScaledVector(dir, player.speed);
                } else {
                    // Đã vào tầm đánh cận chiến -> Đấm
                    if (!isAttacking) {
                        isAttacking = true;
                        
                        // Hiệu ứng đấm FPS
                        playerFist.position.z = -0.2;
                        setTimeout(() => {
                            playerFist.position.z = -0.5;
                            isAttacking = false;
                        }, 200);

                        // Trừ máu
                        lockedTarget.userData.hp -= CONFIG.DAMAGE;

                        if (lockedTarget.userData.hp <= 0) {
                            scene.remove(lockedTarget);
                            targetsList = targetsList.filter(t => t !== lockedTarget);
                            
                            kills.blue++;
                            document.getElementById('blue-kills').innerText = kills.blue;
                            
                            lockedTarget = null;
                            document.getElementById('target-banner').style.display = 'none';
                        }
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Tự động kích hoạt khi trang tải xong
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>

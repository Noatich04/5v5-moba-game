<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 5v5 MOBA FPS Arena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
        #canvas-container { width: 100vw; height: 100vh; display: block; cursor: crosshair; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 12px; height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%; pointer-events: none; z-index: 10;
        }
        #crosshair::after {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 2px; height: 2px; background: #ef4444; border-radius: 50%;
        }

        .hud-top {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 30px; align-items: center; z-index: 10;
            background: rgba(15, 23, 42, 0.85); padding: 10px 25px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); color: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .score-box { font-size: 18px; font-weight: 800; }
        .score-blue { color: #38bdf8; }
        .score-red { color: #f43f5e; }
        .timer { font-size: 24px; font-weight: 900; color: #facc15; font-family: monospace; }

        .hud-bottom {
            position: absolute; bottom: 20px; left: 20px; z-index: 10;
            background: rgba(15, 23, 42, 0.85); padding: 14px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15); width: 250px; color: #fff;
        }
        .hp-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 13px; margin-bottom: 5px; }
        .hp-bar-bg { width: 100%; height: 14px; background: #1e293b; border-radius: 7px; overflow: hidden; }
        .hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #10b981, #34d399); transition: width 0.15s; }

        .skills-container { position: absolute; bottom: 20px; right: 20px; z-index: 10; display: flex; gap: 10px; }
        .skill-btn {
            width: 65px; height: 65px; background: rgba(15, 23, 42, 0.85);
            border: 2px solid #38bdf8; border-radius: 12px; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            color: #fff; font-weight: bold; position: relative; font-size: 13px;
        }
        .skill-btn small { font-size: 9px; color: #94a3b8; margin-top: 2px; }
        .cooldown-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); border-radius: 10px; display: none;
            align-items: center; justify-content: center; font-size: 20px; color: #facc15; font-weight: 900;
        }

        #guide-msg {
            position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
            color: #38bdf8; background: rgba(0,0,0,0.7); padding: 6px 14px;
            border-radius: 15px; font-weight: bold; z-index: 10; font-size: 13px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="guide-msg">BẤM CHUỘT VÀO MÀN HÌNH ĐỂ KHÓA CHUỘT Quay MẶT | W-A-S-D ĐỂ DI CHUYỂN BAN</div>

    <div class="hud-top">
        <div class="score-box score-blue">XANH: <span id="blue-kills">0</span>/30</div>
        <div class="timer" id="timer">05:00</div>
        <div class="score-box score-red">ĐỎ: <span id="red-kills">0</span>/30</div>
    </div>

    <div class="hud-bottom">
        <div class="hp-header">
            <span>TƯỚNG CỦA BẠN</span>
            <span id="hp-text">100 / 100</span>
        </div>
        <div class="hp-bar-bg"><div id="player-hp" class="hp-bar-fill"></div></div>
    </div>

    <div class="skills-container">
        <div class="skill-btn">
            <span>ĐÁNH</span>
            <small>[CLICK / SPACE]</small>
        </div>
        <div class="skill-btn" id="btn-heal" style="border-color:#10b981;">
            <span>HỒI MÁU</span>
            <small>PHÍM [E]</small>
            <div class="cooldown-overlay" id="cd-heal">10</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const CONFIG = { MAX_HP: 100, DAMAGE: 20, HEAL_AMOUNT: 50, HEAL_CD: 10, MATCH_TIME: 300 };

        let scene, camera, renderer, raycaster;
        let player, playerArm;
        let entities = [];
        let kills = { blue: 0, red: 0 };
        let matchTime = CONFIG.MATCH_TIME;
        let healCooldown = 0;
        let isAttacking = false;

        const keys = { w: false, a: false, s: false, d: false };
        let yaw = 0, pitch = 0;

        function initGame() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);
            scene.fog = new THREE.FogExp2(0x0a0f1d, 0.012);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xffffff, 0.9);
            sun.position.set(30, 50, 20);
            sun.castShadow = true;
            scene.add(sun);

            buildMap();
            spawnTowers();

            // Khởi tạo Người chơi (Đội Xanh)
            player = { mesh: new THREE.Group(), hp: CONFIG.MAX_HP, team: 'blue', speed: 0.22, range: 4.0 };
            player.mesh.position.set(0, 1.6, 35);
            scene.add(player.mesh);

            // Tay đấm FPS
            const armGroup = new THREE.Group();
            const armMesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.12, 0.12, 0.45),
                new THREE.MeshStandardMaterial({ color: 0x0284c7 })
            );
            armMesh.position.set(0, 0, -0.22);
            armGroup.add(armMesh);

            const fistMesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.16, 0.16, 0.18),
                new THREE.MeshStandardMaterial({ color: 0x38bdf8 })
            );
            fistMesh.position.set(0, 0, -0.45);
            armGroup.add(fistMesh);

            playerArm = armGroup;
            playerArm.position.set(0.28, -0.25, -0.2);
            camera.add(playerArm);
            player.mesh.add(camera);

            // Bắt sự kiện
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
            
            container.addEventListener('click', () => {
                if (document.pointerLockElement !== container) {
                    container.requestPointerLock();
                } else {
                    performAttack();
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === container) {
                    yaw -= e.movementX * 0.0022;
                    pitch -= e.movementY * 0.0022;
                    pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));

                    player.mesh.rotation.y = yaw;
                    camera.rotation.x = pitch;
                }
            });

            // Sinh đợt lính/tướng máy liên tục mỗi 6 giây
            spawnWave();
            setInterval(spawnWave, 6000);

            setInterval(updateTimer, 1000);
            animate();
        }

        function buildMap() {
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(120, 120),
                new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
            );
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            const lane = new THREE.Mesh(
                new THREE.PlaneGeometry(18, 120),
                new THREE.MeshStandardMaterial({ color: 0x334155 })
            );
            lane.rotation.x = -Math.PI / 2;
            lane.position.y = 0.01;
            scene.add(lane);
        }

        function spawnTowers() {
            createTower(0, -35, 'red');
            createTower(0, 35, 'blue');
        }

        function createTower(x, z, team) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(1.2, 1.5, 7, 12),
                new THREE.MeshStandardMaterial({ color: team === 'blue' ? 0x0284c7 : 0xe11d48 })
            );
            body.position.y = 3.5;
            group.add(body);

            group.position.set(x, 0, z);
            group.userData = { hp: 300, maxHp: 300, team: team, type: 'tower' };
            scene.add(group);
            entities.push(group);
        }

        function spawnWave() {
            // Đội Xanh xuất phát từ Z = 30 tiến lên
            for (let i = 0; i < 2; i++) {
                createBot('blue', (Math.random() - 0.5) * 6, 30);
            }
            // Đội Đỏ xuất phát từ Z = -30 tiến xuống
            for (let i = 0; i < 3; i++) {
                createBot('red', (Math.random() - 0.5) * 6, -30);
            }
        }

        function createBot(team, x, z) {
            const group = new THREE.Group();
            const color = team === 'blue' ? 0x38bdf8 : 0xf43f5e;

            const body = new THREE.Mesh(
                new THREE.CapsuleGeometry(0.45, 0.8, 4, 8),
                new THREE.MeshStandardMaterial({ color: color })
            );
            body.position.y = 0.85;
            group.add(body);

            group.position.set(x, 0, z);
            group.userData = { 
                hp: 100, 
                maxHp: 100, 
                team: team, 
                type: 'bot',
                speed: 0.06 + Math.random() * 0.03,
                targetZ: team === 'blue' ? -35 : 35 
            };
            scene.add(group);
            entities.push(group);
        }

        function onKeyDown(e) {
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = true;
            if (k === 's') keys.s = true;
            if (k === 'a') keys.a = true;
            if (k === 'd') keys.d = true;
            if (k === ' ') performAttack();
            if (k === 'e') triggerHeal();
        }

        function onKeyUp(e) {
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = false;
            if (k === 's') keys.s = false;
            if (k === 'a') keys.a = false;
            if (k === 'd') keys.d = false;
        }

        function performAttack() {
            if (isAttacking) return;
            isAttacking = true;

            playerArm.position.z -= 0.25;
            setTimeout(() => {
                playerArm.position.z = -0.2;
                isAttacking = false;
            }, 140);

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hits = raycaster.intersectObjects(scene.children, true);

            for (let hit of hits) {
                let obj = hit.object;
                while (obj.parent && obj.parent !== scene) obj = obj.parent;

                if (obj.userData && obj.userData.team && obj.userData.team !== player.team) {
                    if (hit.distance <= player.range) {
                        obj.userData.hp -= CONFIG.DAMAGE;

                        if (obj.userData.hp <= 0) {
                            scene.remove(obj);
                            entities = entities.filter(e => e !== obj);
                            kills.blue++;
                            document.getElementById('blue-kills').innerText = kills.blue;
                        }
                    }
                    break;
                }
            }
        }

        function triggerHeal() {
            if (healCooldown > 0) return;
            player.hp = Math.min(CONFIG.MAX_HP, player.hp + CONFIG.HEAL_AMOUNT);
            updateHUD();

            healCooldown = CONFIG.HEAL_CD;
            const cdOverlay = document.getElementById('cd-heal');
            cdOverlay.style.display = 'flex';

            const timer = setInterval(() => {
                healCooldown--;
                cdOverlay.innerText = healCooldown;
                if (healCooldown <= 0) {
                    clearInterval(timer);
                    cdOverlay.style.display = 'none';
                }
            }, 1000);
        }

        function updateHUD() {
            document.getElementById('player-hp').style.width = (player.hp / CONFIG.MAX_HP * 100) + '%';
            document.getElementById('hp-text').innerText = `${player.hp} / ${CONFIG.MAX_HP}`;
        }

        function updateTimer() {
            if (matchTime <= 0) return;
            matchTime--;
            const m = String(Math.floor(matchTime / 60)).padStart(2, '0');
            const s = String(matchTime % 60).padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }

        function animate() {
            requestAnimationFrame(animate);

            // Player movement
            const moveVector = new THREE.Vector3();
            if (keys.w) moveVector.z -= 1;
            if (keys.s) moveVector.z += 1;
            if (keys.a) moveVector.x -= 1;
            if (keys.d) moveVector.x += 1;

            if (moveVector.lengthSq() > 0) {
                moveVector.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                player.mesh.position.addScaledVector(moveVector, player.speed);
            }

            // AI Bot tự di chuyển ra đường giữa để đánh nhau
            for (let i = entities.length - 1; i >= 0; i--) {
                const bot = entities[i];
                if (bot.userData.type === 'bot') {
                    // Tìm đối thủ gần nhất khác đội
                    let nearestEnemy = null;
                    let minDist = 8.0; // Tầm phát hiện kẻ địch

                    // Kiểm tra người chơi nếu khác đội
                    if (bot.userData.team !== player.team) {
                        const distToPlayer = bot.position.distanceTo(player.mesh.position);
                        if (distToPlayer < minDist) {
                            nearestEnemy = player.mesh;
                            minDist = distToPlayer;
                        }
                    }

                    // Kiểm tra các bot khác
                    for (let j = 0; j < entities.length; j++) {
                        const other = entities[j];
                        if (other !== bot && other.userData.team !== bot.userData.team) {
                            const d = bot.position.distanceTo(other.position);
                            if (d < minDist) {
                                nearestEnemy = other;
                                minDist = d;
                            }
                        }
                    }

                    // Di chuyển về phía kẻ địch hoặc chạy tiếp dọc lane
                    if (nearestEnemy) {
                        bot.lookAt(nearestEnemy.position.x, bot.position.y, nearestEnemy.position.z);
                        if (minDist > 2.0) {
                            bot.translateZ(bot.userData.speed);
                        }
                    } else {
                        // Đi thẳng dọc theo đường lane
                        const dir = bot.userData.team === 'blue' ? -1 : 1;
                        bot.position.z += dir * bot.userData.speed;
                        bot.rotation.y = dir === -1 ? 0 : Math.PI;
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>

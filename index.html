<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D MOBA 5v5 FPS Arena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { width: 100vw; height: 100vh; overflow: hidden; font-family: Arial, sans-serif; background: #000; }
        #canvas-container { width: 100%; height: 100%; display: block; }
        
        /* Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 12px; height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%; pointer-events: none; z-index: 10;
        }
        #crosshair::after {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 2px; height: 2px; background: red; border-radius: 50%;
        }

        /* Top HUD */
        .hud-top {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 30px; align-items: center; z-index: 10;
            background: rgba(10, 15, 30, 0.75); padding: 10px 25px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(5px); color: #fff; text-shadow: 0 2px 4px #000;
        }
        .score-box { font-size: 22px; font-weight: bold; }
        .score-blue { color: #4facfe; }
        .score-red { color: #ff0844; }
        .timer { font-size: 26px; font-weight: 900; color: #ffeb3b; letter-spacing: 1px; }

        /* Bottom Player Stats */
        .hud-bottom {
            position: absolute; bottom: 20px; left: 20px; z-index: 10;
            background: rgba(10, 15, 30, 0.8); padding: 15px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2); width: 260px; color: #fff;
        }
        .hp-bar-bg { width: 100%; height: 18px; background: #333; border-radius: 9px; overflow: hidden; margin-top: 5px; }
        .hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00b09b, #96c93d); transition: width 0.2s; }

        /* Skills */
        .skills-container {
            position: absolute; bottom: 20px; right: 20px; z-index: 10;
            display: flex; gap: 15px;
        }
        .skill-btn {
            width: 70px; height: 70px; background: rgba(20, 20, 35, 0.85);
            border: 2px solid #555; border-radius: 12px; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            color: #fff; font-weight: bold; cursor: pointer; position: relative;
        }
        .skill-btn.active { border-color: #00e676; box-shadow: 0 0 10px #00e676; }
        .cooldown-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); border-radius: 10px; display: flex;
            align-items: center; justify-content: center; font-size: 20px; color: #ffeb3b; display: none;
        }

        /* Target Indicator Prompt */
        #target-info {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            color: #ff3366; font-weight: bold; font-size: 16px; background: rgba(0,0,0,0.6);
            padding: 5px 15px; border-radius: 20px; display: none; z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="target-info">ĐÃ KHÓA TIÊU ĐIỂM (TỰ ĐỘNG DI CHUYỂN & ĐÁNH)</div>

    <div class="hud-top">
        <div class="score-box score-blue">XANH: <span id="blue-kills">0</span>/30</div>
        <div class="timer" id="timer">05:00</div>
        <div class="score-box score-red">ĐỎ: <span id="red-kills">0</span>/30</div>
    </div>

    <div class="hud-bottom">
        <div>MÁU TƯỚNG (100 HP)</div>
        <div class="hp-bar-bg"><div id="player-hp" class="hp-bar-fill"></div></div>
        <div style="font-size: 12px; margin-top: 6px; color: #aaa;">Click chuột vào kẻ địch/trụ để TỰ DI CHUYỂN & ĐÁNH</div>
    </div>

    <div class="skills-container">
        <div class="skill-btn active" id="btn-attack">
            <span>ĐÁNH</span>
            <small>[L-Click]</small>
        </div>
        <div class="skill-btn active" id="btn-heal">
            <span>HỒI MÁU</span>
            <small>[Key E]</small>
            <div class="cooldown-overlay" id="cd-heal">10</div>
        </div>
    </div>

    <div id="canvas-container"></div>
    <script src="game.js"></script>
</body>
</html>

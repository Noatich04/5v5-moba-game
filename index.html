<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 5v5 FPS Melee Arena MOBA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: #000; }
        #canvas-container { width: 100vw; height: 100vh; display: block; cursor: crosshair; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 14px; height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%; pointer-events: none; z-index: 10;
        }
        #crosshair::after {
            content: ''; position: absolute; top: 4px; left: 4px;
            width: 2px; height: 2px; background: #ff0055; border-radius: 50%;
        }

        .hud-top {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 30px; align-items: center; z-index: 10;
            background: rgba(15, 23, 42, 0.85); padding: 12px 30px;
            border-radius: 16px; border: 1px solid rgba(255,255,255,0.15); color: #fff;
        }
        .score-box { font-size: 20px; font-weight: 800; }
        .score-blue { color: #38bdf8; }
        .score-red { color: #f43f5e; }
        .timer { font-size: 28px; font-weight: 900; color: #facc15; }

        .hud-bottom {
            position: absolute; bottom: 25px; left: 25px; z-index: 10;
            background: rgba(15, 23, 42, 0.85); padding: 16px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15); width: 280px; color: #fff;
        }
        .hp-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; margin-bottom: 6px; }
        .hp-bar-bg { width: 100%; height: 16px; background: #1e293b; border-radius: 8px; overflow: hidden; }
        .hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #10b981, #34d399); transition: width 0.15s; }

        .skills-container { position: absolute; bottom: 25px; right: 25px; z-index: 10; display: flex; gap: 12px; }
        .skill-btn {
            width: 72px; height: 72px; background: rgba(15, 23, 42, 0.85);
            border: 2px solid #38bdf8; border-radius: 14px; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            color: #fff; font-weight: bold; position: relative;
        }
        .skill-btn small { font-size: 10px; color: #94a3b8; }
        .cooldown-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); border-radius: 12px; display: none;
            align-items: center; justify-content: center; font-size: 22px; color: #facc15; font-weight: 900;
        }

        #guide-msg {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            color: #38bdf8; background: rgba(0,0,0,0.7); padding: 8px 16px;
            border-radius: 20px; font-weight: bold; z-index: 10; font-size: 14px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="guide-msg">DÙNG PHÍM [W-A-S-D] ĐỂ DI CHUYỂN | BẤM CHUỘT ĐỂ XOAY GÓC NHÌN & ĐÁNH</div>

    <div class="hud-top">
        <div class="score-box score-blue">XANH: <span id="blue-kills">0</span>/30</div>
        <div class="timer" id="timer">05:00</div>
        <div class="score-box score-red">ĐỎ: <span id="red-kills">0</span>/30</div>
    </div>

    <div class="hud-bottom">
        <div class="hp-header">
            <span>TƯỚNG CỦA BẠN</span>
            <span id="hp-text">100 / 100</span>
        </div>
        <div class="hp-bar-bg"><div id="player-hp" class="hp-bar-fill"></div></div>
    </div>

    <div class="skills-container">
        <div class="skill-btn">
            <span>ĐÁNH</span>
            <small>[CLICK / SPACE]</small>
        </div>
        <div class="skill-btn" id="btn-heal" style="border-color:#10b981;">
            <span>HỒI MÁU</span>
            <small>PHÍM [E]</small>
            <div class="cooldown-overlay" id="cd-heal">10</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const CONFIG = { MAX_HP: 100, DAMAGE: 20, HEAL_AMOUNT: 50, HEAL_CD: 10, MATCH_TIME: 300 };

        let scene, camera, renderer, raycaster;
        let player, playerFist;
        let targetsList = [];
        let kills = { blue: 0, red: 0 };
        let matchTime = CONFIG.MATCH_TIME;
        let healCooldown = 0;
        let isAttacking = false;

        // Trạng thái phím di chuyển
        const keys = { w: false, a: false, s: false, d: false };
        let yaw = 0, pitch = 0; // Góc xoay camera

        function initGame() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();

            // Ánh sáng
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(40, 60, 20);
            scene.add(sun);

            // Bản đồ, Trụ, Địch
            buildMap();
            spawnTowers();
            spawnHeroes();

            // Tạo Player
            player = { mesh: new THREE.Group(), hp: CONFIG.MAX_HP, team: 'blue', speed: 0.25, range: 3.5 };
            player.mesh.position.set(0, 1.5, 30);
            scene.add(player.mesh);

            // Tay đấm
            const fistGeo = new THREE.BoxGeometry(0.25, 0.25, 0.6);
            const fistMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
            playerFist = new THREE.Mesh(fistGeo, fistMat);
            playerFist.position.set(0.35, -0.3, -0.5);
            camera.add(playerFist);
            player.mesh.add(camera);

            // Bắt sự kiện bàn phím & chuột
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
            
            // Khóa chuột khi click vào màn hình để quay góc nhìn bằng chuột
            container.addEventListener('click', () => {
                container.requestPointerLock();
                performAttack();
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === container) {
                    yaw -= e.movementX * 0.002;
                    pitch -= e.movementY * 0.002;
                    pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));

                    player.mesh.rotation.y = yaw;
                    camera.rotation.x = pitch;
                }
            });

            setInterval(updateTimer, 1000);
            animate();
        }

        function buildMap() {
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(120, 120),
                new THREE.MeshStandardMaterial({ color: 0x1e293b })
            );
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            const lane = new THREE.Mesh(
                new THREE.PlaneGeometry(20, 120),
                new THREE.MeshStandardMaterial({ color: 0x334155 })
            );
            lane.rotation.x = -Math.PI / 2;
            lane.position.y = 0.02;
            scene.add(lane);
        }

        function spawnTowers() {
            createTower(0, -20, 'red');
            createTower(0, 20, 'blue');
        }

        function createTower(x, z, team) {
            const group = new THREE.Group();
            const mesh = new THREE.Mesh(
                new THREE.CylinderGeometry(1.5, 2, 8, 16),
                new THREE.MeshStandardMaterial({ color: team === 'blue' ? 0x0284c7 : 0xe11d48 })
            );
            mesh.position.y = 4;
            group.add(mesh);
            group.position.set(x, 0, z);
            group.userData = { hp: 300, team: team };
            scene.add(group);
            targetsList.push(group);
        }

        function spawnHeroes() {
            for (let i = 0; i < 4; i++) createEntity('blue', -12 + i * 8, 25);
            for (let i = 0; i < 5; i++) createEntity('red', -16 + i * 8, -25);
        }

        function createEntity(team, x, z) {
            const group = new THREE.Group();
            const mesh = new THREE.Mesh(
                new THREE.CylinderGeometry(0.6, 0.6, 2, 16),
                new THREE.MeshStandardMaterial({ color: team === 'blue' ? 0x38bdf8 : 0xf43f5e })
            );
            mesh.position.y = 1;
            group.add(mesh);
            group.position.set(x, 0, z);
            group.userData = { hp: 100, team: team };
            scene.add(group);
            targetsList.push(group);
        }

        function onKeyDown(e) {
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = true;
            if (k === 's') keys.s = true;
            if (k === 'a') keys.a = true;
            if (k === 'd') keys.d = true;
            if (k === ' ') performAttack();
            if (k === 'e') triggerHeal();
        }

        function onKeyUp(e) {
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = false;
            if (k === 's') keys.s = false;
            if (k === 'a') keys.a = false;
            if (k === 'd') keys.d = false;
        }

        function performAttack() {
            if (isAttacking) return;
            isAttacking = true;

            // Animation Đấm
            playerFist.position.z = -0.2;
            setTimeout(() => {
                playerFist.position.z = -0.5;
                isAttacking = false;
            }, 150);

            // Kiểm tra đòn đánh trúng địch ở giữa tâm ngắm
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hits = raycaster.intersectObjects(scene.children, true);

            for (let hit of hits) {
                let obj = hit.object;
                while (obj.parent && obj.parent !== scene) obj = obj.parent;

                if (obj.userData && obj.userData.team && obj.userData.team !== player.team) {
                    if (hit.distance <= player.range) {
                        obj.userData.hp -= CONFIG.DAMAGE;
                        if (obj.userData.hp <= 0) {
                            scene.remove(obj);
                            targetsList = targetsList.filter(t => t !== obj);
                            kills.blue++;
                            document.getElementById('blue-kills').innerText = kills.blue;
                        }
                    }
                    break;
                }
            }
        }

        function triggerHeal() {
            if (healCooldown > 0) return;
            player.hp = Math.min(CONFIG.MAX_HP, player.hp + CONFIG.HEAL_AMOUNT);
            updateHUD();

            healCooldown = CONFIG.HEAL_CD;
            const cdOverlay = document.getElementById('cd-heal');
            cdOverlay.style.display = 'flex';

            const timer = setInterval(() => {
                healCooldown--;
                cdOverlay.innerText = healCooldown;
                if (healCooldown <= 0) {
                    clearInterval(timer);
                    cdOverlay.style.display = 'none';
                }
            }, 1000);
        }

        function updateHUD() {
            document.getElementById('player-hp').style.width = (player.hp / CONFIG.MAX_HP * 100) + '%';
            document.getElementById('hp-text').innerText = `${player.hp} / ${CONFIG.MAX_HP}`;
        }

        function updateTimer() {
            if (matchTime <= 0) return;
            matchTime--;
            const m = String(Math.floor(matchTime / 60)).padStart(2, '0');
            const s = String(matchTime % 60).padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }

        function animate() {
            requestAnimationFrame(animate);

            // Di chuyển nhân vật dựa theo phím W-A-S-D và hướng mặt
            const moveVector = new THREE.Vector3();
            if (keys.w) moveVector.z -= 1;
            if (keys.s) moveVector.z += 1;
            if (keys.a) moveVector.x -= 1;
            if (keys.d) moveVector.x += 1;

            if (moveVector.lengthSq() > 0) {
                moveVector.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                player.mesh.position.addScaledVector(moveVector, player.speed);
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
